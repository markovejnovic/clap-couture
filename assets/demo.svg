<text x="300.0" y="111" fill="#7f849c" text-anchor="middle" font-size="12.5" font-weight="600">orbit — help</text>
<text x="52.0" y="150.0" fill="#a6e3a1" font-weight="700">$</text>
<text x="68.8" y="150.0" fill="#cdd6f4">orbit </text>
<text x="119.2" y="150.0" fill="#94e2d5">--help</text>
<text x="52.0" y="192.0" fill="#cdd6f4">Deploy and manage your apps from the terminal.</text>
<text x="52.0" y="234.0" fill="#f9e2af" font-weight="700">Usage:</text>
<text x="110.8" y="234.0" fill="#cdd6f4">orbit &lt;COMMAND&gt;</text>
<text x="52.0" y="276.0" fill="#f9e2af" font-weight="700">Commands:</text>
<text x="68.8" y="297.0" fill="#89b4fa" font-weight="700">search</text>
<text x="152.8" y="297.0" fill="#a6adc8">Search your deployment history</text>
<text x="68.8" y="318.0" fill="#89b4fa" font-weight="700">status</text>
<text x="152.8" y="318.0" fill="#a6adc8">Show recent activity</text>
<text x="68.8" y="339.0" fill="#89b4fa" font-weight="700">logs</text>
<text x="152.8" y="339.0" fill="#a6adc8">Tail live logs</text>
<text x="68.8" y="360.0" fill="#89b4fa" font-weight="700">deploy</text>
<text x="152.8" y="360.0" fill="#a6adc8">Ship the current project</text>
<text x="68.8" y="381.0" fill="#89b4fa" font-weight="700">rollback</text>
<text x="152.8" y="381.0" fill="#a6adc8">Roll back to a previous release</text>
<text x="68.8" y="402.0" fill="#89b4fa" font-weight="700">secrets</text>
<text x="152.8" y="402.0" fill="#a6adc8">Manage environment secrets</text>
<text x="68.8" y="423.0" fill="#89b4fa" font-weight="700">login</text>
<text x="152.8" y="423.0" fill="#a6adc8">Sign in to your account</text>
<text x="68.8" y="444.0" fill="#89b4fa" font-weight="700">sync</text>
<text x="152.8" y="444.0" fill="#a6adc8">Sync settings across machines</text>
<text x="68.8" y="465.0" fill="#89b4fa" font-weight="700">help</text>
<text x="152.8" y="465.0" fill="#a6adc8">Print this message or a subcommand's help</text>
<text x="52.0" y="507.0" fill="#f9e2af" font-weight="700">Options:</text>
<text x="68.8" y="528.0" fill="#89b4fa" font-weight="700">-h, --help</text>

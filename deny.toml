# Configuration for cargo-deny (https://embarkstudios.github.io/cargo-deny/).
# Run locally with: cargo install cargo-deny && cargo deny check

[advisories]
version = 2
# Add RUSTSEC IDs here to temporarily accept a known advisory, e.g.:
# ignore = ["RUSTSEC-0000-0000"]
ignore = []

[licenses]
version = 2
# Permissive licenses compatible with this crate's MIT license. Extend this
# list if cargo-deny reports a dependency using a license not covered here.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
]
confidence-threshold = 0.8

[bans]
# Duplicate versions are common in transitive trees and usually not
# actionable, so warn rather than fail.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

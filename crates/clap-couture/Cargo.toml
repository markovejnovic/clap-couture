[package]
name = "clap-couture"
version = "0.1.0"
edition = "2024"
description = "Beautiful, categorized --help for clap CLIs: group subcommands into titled, styled sections."
keywords = ["clap", "cli", "help", "terminal", "derive"]
categories = ["command-line-interface", "development-tools"]
readme = "../../README.md"
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
clap-couture-derive = { path = "../clap-couture-derive", version = "0.1.0" }
clap = { workspace = true }
pulldown-cmark = { workspace = true, optional = true }
unicode-width = { workspace = true }
thiserror = { workspace = true, optional = true }
cliclack = { workspace = true, optional = true }
console = { workspace = true, optional = true }
dialoguer = { workspace = true, optional = true }
inquire = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
encoding_rs = { workspace = true, optional = true }
which = { workspace = true, optional = true }
anstream = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }
shlex = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
codepage = { workspace = true, optional = true }
windows-sys = { workspace = true, optional = true }

[features]
markdown = ["dep:pulldown-cmark"]
interactive = [
    "clap/string",
    "clap-couture-derive/interactive",
    "dep:libc",
    "dep:thiserror",
    "dep:windows-sys",
]
interactive-cliclack = ["interactive", "dep:cliclack", "dep:console"]
interactive-dialoguer = ["interactive", "dep:dialoguer", "dep:console"]
interactive-inquire = ["interactive", "dep:inquire"]
interactive-editor = [
    "interactive",
    "clap-couture-derive/interactive-editor",
    "dep:anstream",
    "dep:codepage",
    "dep:encoding_rs",
    "dep:libc",
    "dep:shlex",
    "dep:tempfile",
    "dep:which",
    "dep:windows-sys",
]

[[example]]
name = "deploy"
required-features = ["interactive-editor"]

[dev-dependencies]
clap = { workspace = true, features = ["derive", "env"] }
rstest = { workspace = true }

[lints]
workspace = true

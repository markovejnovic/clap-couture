[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/atuinsh/clap-couture"

[workspace.dependencies]
heck = "0.5"
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }
clap = "4"
pulldown-cmark = { version = "0.13", default-features = false }
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_tokenstream = "0.3"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }

blanket_clippy_restriction_lints = "allow"
implicit_return = "allow"            # vs needless_return (kept)
question_mark_used = "allow"         # vs question_mark (kept)
unseparated_literal_suffix = "allow" # vs separated_literal_suffix (kept): 1_u8
semicolon_outside_block = "allow"    # vs semicolon_inside_block (kept)
mod_module_files = "allow"           # vs self_named_module_files (kept): foo.rs
pub_without_shorthand = "allow"      # vs pub_with_shorthand (kept): pub(crate)

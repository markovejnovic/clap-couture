name: PR title

# Squash merges commit the PR title, and release-plz builds the changelog from those commits.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional:
    name: conventional commit
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # A new type also needs a `commit_parsers` rule in release-plz.toml, or it lands under "Other".
          types: |
            feat
            fix
            perf
            deprecated
            security
            docs
            refactor
            test
            style
            build
            ci
            chore
            revert

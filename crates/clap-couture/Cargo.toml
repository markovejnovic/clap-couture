[package]
name = "clap-couture"
version = "0.1.0"
edition.workspace = true
description = "Polish for clap CLIs: categorized, markdown --help, and prompts for missing args: masked secrets, $EDITOR, confirmations and stdin."
keywords = ["clap", "cli", "help", "terminal", "derive"]
categories = ["command-line-interface", "development-tools"]
readme = "../../README.md"
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
clap-couture-derive = { path = "../clap-couture-derive", version = "0.1.0", optional = true }
clap = { workspace = true }
pulldown-cmark = { workspace = true, optional = true }
unicode-width = { workspace = true }
thiserror = { workspace = true, optional = true }
cliclack = { workspace = true, optional = true }
console = { workspace = true, optional = true }
dialoguer = { workspace = true, optional = true, features = ["password"] }
inquire = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
encoding_rs = { workspace = true, optional = true }
which = { workspace = true, optional = true }
anstream = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }
shlex = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
codepage = { workspace = true, optional = true }
windows-sys = { workspace = true, optional = true }

[features]
# Everything but `markdown`, which changes what `*`, `_` and `<...>` mean in help text.
default = ["derive", "interactive-cliclack", "interactive-editor"]
# `#[derive(Couture)]`. Without it, implement `Couture` by hand.
derive = ["dep:clap-couture-derive"]
# Help text is CommonMark, rendered in the terminal.
markdown = ["dep:pulldown-cmark"]
# Prompts are declared with `#[couture(prompt)]`, so they need the derive.
interactive = [
    "derive",
    "clap/env",
    "clap/string",
    "clap-couture-derive/interactive",
    "dep:libc",
    "dep:secrecy",
    "dep:thiserror",
    "dep:windows-sys",
]
interactive-cliclack = ["interactive", "dep:cliclack", "dep:console"]
interactive-dialoguer = ["interactive", "dep:dialoguer", "dep:console"]
interactive-inquire = ["interactive", "dep:inquire"]
interactive-editor = [
    "interactive",
    "clap-couture-derive/interactive-editor",
    "dep:anstream",
    "dep:codepage",
    "dep:encoding_rs",
    "dep:libc",
    "dep:shlex",
    "dep:tempfile",
    "dep:which",
    "dep:windows-sys",
]
# Everything, with cliclack for prompts: it's the default backend whenever it's enabled.
full = ["derive", "markdown", "interactive-cliclack", "interactive-editor"]

# Document every backend, not only the default one.
[package.metadata.docs.rs]
all-features = true
# Lightens the logo on the dark themes.
rustdoc-args = ["--html-in-header", "docs-header.html"]

[[example]]
name = "01-orbit-disorganized"

[[example]]
name = "01-orbit-organized"
required-features = ["derive"]

[[example]]
name = "02-markdown-simple"
required-features = ["derive", "markdown"]

[[example]]
name = "03-interactive"
required-features = ["interactive"]

[[example]]
name = "04-interactive-i18n"
required-features = ["interactive"]

[[example]]
name = "05-interactive-confirm"
required-features = ["interactive"]

[[example]]
name = "06-interactive-editor"
required-features = ["interactive-editor"]

[[example]]
name = "07-interactive-secret"
required-features = ["interactive"]

[[example]]
name = "08-interactive-prompter"
required-features = ["interactive"]

[[example]]
name = "09-interactive-custom-backend"
required-features = ["derive", "markdown", "interactive"]

[[example]]
name = "10-interactive-stdin"
required-features = ["interactive"]

[[example]]
name = "11-interactive-dash"
required-features = ["interactive"]

[dev-dependencies]
clap = { workspace = true, features = ["derive", "env", "wrap_help"] }
rstest = { workspace = true }

[lints]
workspace = true

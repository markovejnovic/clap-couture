[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/atuinsh/clap-couture"

[workspace.dependencies]
heck = "0.5"
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }
clap = "4"
pulldown-cmark = { version = "0.13", default-features = false }
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_tokenstream = "0.3"
rstest = { version = "0.27", default-features = false } # no async tests
thiserror = "2"
cliclack = "0.5"
console = "0.16"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }

blanket_clippy_restriction_lints = "allow"

# Conflicting restriction-lint pairs: allow one side, keep the other.
implicit_return = "allow"            # vs needless_return (kept)
question_mark_used = "allow"         # vs question_mark (kept)
unseparated_literal_suffix = "allow" # vs separated_literal_suffix (kept): write 1u8
semicolon_outside_block = "allow"    # vs semicolon_inside_block (kept)
mod_module_files = "allow"           # vs self_named_module_files (kept): write foo/mod.rs
unused_result_ok = "allow"           # vs let_underscore_must_use (kept): discard via `.ok()`
pub_with_shorthand = "allow"         # vs pub_without_shorthand (kept): write pub(crate)

missing_docs_in_private_items = "allow"     # private items get docs only where the name falls short
missing_inline_in_public_items = "allow"    # nothing here is hot
single_call_fn = "allow"                    # hurts readability
missing_trait_methods = "allow"             # a provided method exists to be inherited
exhaustive_structs = "allow"                # `#[non_exhaustive]` is an API choice, not a lint
pub_use = "allow"                           # the derive-macro re-export is this crate's API
pattern_type_mismatch = "allow"             # unsatisfiable without `all`'s needless_borrowed_reference/match_ref_pats
min_ident_chars = "allow"                   # short idents (`i`, `ty`, ...) are idiomatic
shadow_reuse = "allow"                      # shadowing is a common, readable Rust idiom
shadow_unrelated = "allow"                  # as above; shadow_same stays on
absolute_paths = "allow"                    # fully-qualified paths in macro output are deliberate
field_scoped_visibility_modifiers = "allow" # `pub(crate)` fields are fine
redundant_pub_crate = "allow"               # `pub(crate)` in a private module is harmless
tests_outside_test_module = "allow"         # integration tests under tests/ have no test module

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustfmt.toml uses unstable options, so formatting must be checked
      # with a nightly rustfmt.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Each prompt backend alone: `--all-features` hides a `cfg` that only one of them sets.
      - run: cargo clippy -p clap-couture --all-targets --no-default-features --features interactive -- -D warnings
      - run: cargo clippy -p clap-couture --all-targets --no-default-features --features interactive-cliclack -- -D warnings
      - run: cargo clippy -p clap-couture --all-targets --no-default-features --features interactive-dialoguer -- -D warnings
      - run: cargo clippy -p clap-couture --all-targets --no-default-features --features interactive-inquire -- -D warnings
      - run: cargo clippy -p clap-couture --all-targets --features interactive-editor -- -D warnings
      # The editor runs without `sh` on Windows.
      - run: cargo clippy -p clap-couture --lib --tests --target x86_64-pc-windows-msvc --features interactive-editor -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features
      # `--all-features` never builds `render/plain.rs`; this also covers building without the derive.
      - run: cargo build -p clap-couture --no-default-features

  test-windows:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The editor runs without `sh` there: PATHEXT lookup, word splitting, the console's Ctrl+C.
      - run: cargo test -p clap-couture --features interactive-editor

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  example-assets:
    name: example assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `ansi-to-html.py` runs through `uv run`, in the environment `uv.lock` pins.
      - uses: astral-sh/setup-uv@v10.3.0
      # The SVGs differ across OSes; the `.ansi` captures they're rendered from don't.
      - run: ./scripts/render-examples.sh --ansi-only
      - name: Check captures are committed
        run: |
          stale=$(git status --porcelain -- 'assets/*.ansi' crates/clap-couture/docs)
          if [[ -n $stale ]]; then
            echo "$stale"
            git diff -- 'assets/*.ansi' crates/clap-couture/docs
            echo "::error::Example --help changed; run scripts/render-examples.sh and commit assets/ and crates/clap-couture/docs/."
            exit 1
          fi

  docs:
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --all-features --no-deps

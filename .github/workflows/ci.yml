name: CI

on:
  push:
    branches: [main]
  pull_request:
  # `clap-bump.yml` runs all of CI on its bump branch before it opens a PR.
  workflow_call:
    inputs:
      ref:
        description: The branch, tag or SHA to check out; empty checks out the event's ref.
        type: string
        required: false
        default: ""

concurrency:
  # Under `workflow_call`, `github.*` is the caller's, so the ref keeps the groups apart.
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
      # rustfmt.toml uses unstable options, so formatting must be checked
      # with a nightly rustfmt.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Each prompt backend alone: `--all-features` hides a `cfg` that only one of them sets.
      - run: cargo clippy -p clap-couture --all-targets --no-default-features --features interactive -- -D warnings
      - run: cargo clippy -p clap-couture --all-targets --no-default-features --features interactive-cliclack -- -D warnings
      - run: cargo clippy -p clap-couture --all-targets --no-default-features --features interactive-dialoguer -- -D warnings
      - run: cargo clippy -p clap-couture --all-targets --no-default-features --features interactive-inquire -- -D warnings
      - run: cargo clippy -p clap-couture --all-targets --features interactive-editor -- -D warnings
      # The editor runs without `sh` on Windows.
      - run: cargo clippy -p clap-couture --lib --tests --target x86_64-pc-windows-msvc --features interactive-editor -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features
      # `--all-features` never builds `render/plain.rs`; this also covers building without the derive.
      - run: cargo build -p clap-couture --no-default-features

  # couture copies clap internals, so both ends of the clap range Cargo.toml allows are tested.
  clap-bounds:
    name: test (clap ${{ matrix.bound }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bound: [min, max]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: clap-${{ matrix.bound }}
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Read the clap bounds
        id: bounds
        shell: bash # `-o pipefail`, so a malformed clap line fails the step
        run: uv run scripts/clap-bounds.py bounds | tee -a "$GITHUB_OUTPUT"
      # The older `clap_*` crates the min pulls in all fit the MSRV, so the MSRV-aware
      # resolver needs no `CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS` override.
      - name: Lock clap at its ${{ matrix.bound }}
        env:
          CLAP: ${{ steps.bounds.outputs[matrix.bound] }}
        run: cargo update -p clap --precise "$CLAP"
      - name: Check Cargo.lock is at the max
        if: matrix.bound == 'max'
        run: |
          if ! git diff --exit-code -- Cargo.lock; then
            echo "::error::Cargo.lock isn't at clap's max; run \`cargo update -p clap --precise <max>\` and commit it."
            exit 1
          fi
      - run: cargo tree -i clap -e normal --depth 0
      - run: cargo test --workspace --all-features

  # The Python in `scripts/`, in the environment `uv.lock` pins.
  scripts:
    name: scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv run ruff check scripts
      - run: uv run ruff format --check scripts
      - run: uv run pyright
      - run: uv run pytest

  test-windows:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The editor runs without `sh` there: PATHEXT lookup, word splitting, the console's Ctrl+C.
      - run: cargo test -p clap-couture --features interactive-editor

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: dtolnay/rust-toolchain@1.120
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  example-assets:
    name: example assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `ansi-to-html.py` runs through `uv run`, in the environment `uv.lock` pins.
      - uses: astral-sh/setup-uv@v10.3.2
      - run: ./scripts/render-examples.sh
      - name: Check captures are committed
        run: |
          stale=$(git status --porcelain -- 'assets/*.ansi' crates/clap-couture/docs)
          if [[ -n $stale ]]; then
            echo "$stale"
            git diff -- 'assets/*.ansi' crates/clap-couture/docs
            echo "::error::Example --help changed; run scripts/render-examples.sh and commit assets/ and crates/clap-couture/docs/."
            exit 1
          fi

  docs:
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --all-features --no-deps

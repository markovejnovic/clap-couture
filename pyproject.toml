# Python tooling for the repo's scripts; the crates themselves are Rust.
[project]
name = "clap-couture-scripts"
version = "0.0.0"
description = "Scripts that record clap-couture's examples and fill in their docs."
requires-python = ">=3.12"
dependencies = [
    "ansi2html==1.9.5",
    "click==8.5.0",
    "httpx==0.28.1",
    "pillow==11.3.0",
    "pyromark==0.9.14",
    "semver==3.1.0",
    "tomlkit==0.15.1",
]

[dependency-groups]
dev = [
    "pyright==1.1.408",
    "pytest==9.1.1",
    "ruff==0.16.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 87
target-version = "py312"
src = ["scripts"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with the formatter
    "CPY001", # the repo's files carry no copyright headers
    "D203",   # conflicts with D211: no blank line before a class docstring
    "D213",   # conflicts with D212: the summary starts on the docstring's first line
    "S603",   # every subprocess call takes an argument list, never a shell string
]

[tool.ruff.lint.per-file-ignores]
"scripts/tests/**" = [
    "D103",    # a test's name says what it checks
    "INP001",  # pytest imports the tests by path
    "PLR2004", # expected values are the point of a test
    "S101",    # pytest checks with `assert`
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
include = ["scripts"]
extraPaths = ["scripts"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportCallInDefaultInitializer = "error"
reportImplicitOverride = "error"
reportImplicitStringConcatenation = "error"
reportImportCycles = "error"
reportMissingSuperCall = "error"
reportPropertyTypeMismatch = "error"
reportUninitializedInstanceVariable = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedCallResult = "error"

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
# The tests import `devtools` as the scripts do.
pythonpath = ["scripts"]
addopts = ["--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true

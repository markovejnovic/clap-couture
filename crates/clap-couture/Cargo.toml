[package]
name = "clap-couture"
version = "0.1.0"
edition = "2024"
description = "Beautiful, categorized --help for clap CLIs: group subcommands into titled, styled sections."
keywords = ["clap", "cli", "help", "terminal", "derive"]
categories = ["command-line-interface", "development-tools"]
readme = "../../README.md"
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
clap-couture-derive = { path = "../clap-couture-derive", version = "0.1.0", optional = true }
clap = { workspace = true }
pulldown-cmark = { workspace = true, optional = true }
unicode-width = { workspace = true }
thiserror = { workspace = true, optional = true }
cliclack = { workspace = true, optional = true }
console = { workspace = true, optional = true }
dialoguer = { workspace = true, optional = true }
inquire = { workspace = true, optional = true }

[features]
default = ["full"]
# `#[derive(Couture)]`. Without it, implement `Couture` by hand.
derive = ["dep:clap-couture-derive"]
markdown = ["dep:pulldown-cmark"]
# Prompts are declared with `#[couture(prompt)]`, so they need the derive.
interactive = ["derive", "clap/string", "clap-couture-derive/interactive", "dep:thiserror"]
interactive-cliclack = ["interactive", "dep:cliclack", "dep:console"]
interactive-dialoguer = ["interactive", "dep:dialoguer", "dep:console"]
interactive-inquire = ["interactive", "dep:inquire"]
# Everything, with cliclack for prompts: it's the default backend whenever it's enabled.
full = ["derive", "markdown", "interactive-cliclack"]

# Document every backend, not only the default one.
[package.metadata.docs.rs]
all-features = true
# Lightens the logo on the dark themes.
rustdoc-args = ["--html-in-header", "docs-header.html"]

[[example]]
name = "01-orbit-disorganized"

[[example]]
name = "01-orbit-organized"
required-features = ["derive"]

[[example]]
name = "02-markdown-simple"
required-features = ["derive", "markdown"]

[[example]]
name = "03-interactive"
required-features = ["interactive"]

[[example]]
name = "04-interactive-i18n"
required-features = ["interactive"]

[[example]]
name = "09-interactive-custom-backend"
required-features = ["derive", "markdown", "interactive"]

[dev-dependencies]
clap = { workspace = true, features = ["derive", "env"] }
rstest = { workspace = true }

[lints]
workspace = true

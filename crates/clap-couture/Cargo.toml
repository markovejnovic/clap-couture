[package]
name = "clap-couture"
version = "0.1.0"
edition = "2024"
description = "Beautiful, categorized --help for clap CLIs: group subcommands into titled, styled sections."
keywords = ["clap", "cli", "help", "terminal", "derive"]
categories = ["command-line-interface", "development-tools"]
readme = "../../README.md"
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
clap-couture-derive = { path = "../clap-couture-derive", version = "0.1.0" }
clap = { workspace = true }
pulldown-cmark = { workspace = true, optional = true }
unicode-width = { workspace = true }
thiserror = { workspace = true, optional = true }

[features]
markdown = ["dep:pulldown-cmark"]
interactive = ["clap/string", "clap-couture-derive/interactive", "dep:thiserror"]

[dev-dependencies]
clap = { workspace = true, features = ["derive", "env"] }
rstest = { workspace = true }

[lints]
workspace = true
